title: Jiazheng Li # name of the site
author: Jiazheng Li # name of site's author
email: jiazheng.li@uconn.edu # email of site's author
url: https://lijiazheng0917.github.io # root address of the site
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if your site shouldn't use a subpath)
description: Jiazheng Li's homepage # shown in search results and link previews

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  show_description: false # show site description in home page

sass:
  style: compressed

plugins:
  - jekyll-seo-tag

# Files Jekyll should not build or watch. The first lines repeat Jekyll's defaults,
# because setting `exclude` replaces them.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .history/
  - README.md
  - LICENSE.txt
